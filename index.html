<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC LABORATORIO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container text-center my-4">
  <button class="btn btn-outline-primary btn-lg px-4 me-2" onclick="filtrar('todas')">Todas</button>
  <button class="btn btn-outline-success btn-lg px-4" onclick="filtrar('vocales')">Vocales</button>
</div>

<div class="card" data-tipo="vocal" onclick="voltear(this)">
  <div class="card-frente">
    <h1>A</h1>
  </div>
  <div class="card-dorso">
    <img src="../ABC_Laboratorio/a.jpg" class="card-img-top" alt="a.jpg">
    <div class="card-body">
      <h5 class="card-title">Letra A</h5>
      <p class="card-text">Soy la letra a</p>
      <button class="btn btn-primary w-100">Voltear</button>
    </div>
  </div>
</div>

<div class="card" data-tipo="consonante" onclick="voltear(this)">
  <div class="card-frente">
    <h1>B</h1>
  </div>
  <div class="card-dorso">
    <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300&auto=format&fit=crop&q=80" class="card-img-top" alt="Banano">
    <div class="card-body">
      <h5 class="card-title">Letra B</h5>
      <p class="card-text">Soy la letra b</p>
      <button class="btn btn-primary w-100">Voltear</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEfYxKxG0FVlsJL5pNlyT2bRjXh0JMhjY6hW+ALEwIH memudahkan+nvJaDHga3lsp4nC" crossorigin="anonymous"></script>
</body>
</html>
